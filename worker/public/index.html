<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Link Saver · 收藏夹</title>
  <meta name="description" content="Link Saver —— 你的网页收藏服务" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <!-- 登录视图 -->
  <div id="login-view" class="login-view hidden">
    <div class="login-card">
      <div class="brand">
        <img class="brand-icon" src="/logo.png" width="44" height="44" alt="" />
        <h1>Link Saver</h1>
        <p class="brand-sub">登录后查看你的全部收藏</p>
      </div>

      <div id="login-status" class="login-status" role="alert"></div>

      <div class="auth-tabs" id="auth-tabs">
        <button class="auth-tab active" data-tab="login" type="button">登录</button>
        <button class="auth-tab" data-tab="register" type="button">注册</button>
      </div>

      <!-- 登录：密码 / 验证码 两种方式 -->
      <div id="view-login">
        <div class="form-row">
          <label for="login-email">邮箱</label>
          <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="form-row" id="login-password-row">
          <div class="label-row">
            <label for="login-password">密码</label>
            <a id="link-forgot" href="#">忘记密码？</a>
          </div>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div class="form-row code-row hidden" id="login-code-row">
          <label for="login-code">验证码</label>
          <div class="code-input">
            <input id="login-code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位数字验证码" autocomplete="one-time-code" />
            <button id="btn-login-code-send" type="button" class="btn-link" data-label="发送验证码">发送验证码</button>
          </div>
        </div>

        <button id="btn-login" type="button" class="btn-primary">登录</button>
        <button id="btn-switch-login" type="button" class="btn-text">使用验证码登录</button>
      </div>

      <!-- 注册：邮箱 + 密码 + 邮箱验证码 -->
      <div id="view-register" class="hidden">
        <div class="form-row">
          <label for="reg-email">邮箱</label>
          <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="form-row">
          <label for="reg-password">密码（至少 8 位，含字母和数字）</label>
          <input id="reg-password" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <div class="form-row code-row">
          <label for="reg-code">邮箱验证码</label>
          <div class="code-input">
            <input id="reg-code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位数字验证码" autocomplete="one-time-code" />
            <button id="btn-reg-send" type="button" class="btn-link" data-label="发送验证码">发送验证码</button>
          </div>
        </div>

        <button id="btn-register" type="button" class="btn-primary">注册并登录</button>
        <p class="auth-note">已有账号？切换到「登录」。</p>
      </div>

      <!-- 找回密码：重置验证码 + 新密码 -->
      <div id="view-reset" class="hidden">
        <div class="form-row">
          <label for="reset-email">注册邮箱</label>
          <input id="reset-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="form-row code-row">
          <label for="reset-code">重置验证码</label>
          <div class="code-input">
            <input id="reset-code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位数字验证码" autocomplete="one-time-code" />
            <button id="btn-reset-send" type="button" class="btn-link" data-label="发送验证码">发送验证码</button>
          </div>
        </div>
        <div class="form-row">
          <label for="reset-password">新密码（至少 8 位，含字母和数字）</label>
          <input id="reset-password" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <button id="btn-reset" type="button" class="btn-primary">重置密码并登录</button>
        <button id="btn-back-login" type="button" class="btn-text">返回登录</button>
      </div>

      <p class="login-hint">已安装 Link Saver 插件并登录？打开本页面会自动登录；网页端主动退出后新标签页不再自动登录，从插件的「打开 Web 端」打开仍会直接登录。网页与插件的登录互不影响。</p>
    </div>
  </div>

  <!-- 应用视图 -->
  <div id="app-view" class="app-view hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="logo" id="logo-home" role="button" tabindex="0" title="重置筛选，回到网站列表"><img class="logo-icon" src="/logo.png" width="22" height="22" alt="" /><span class="logo-text">Link Saver</span></div>
        <div class="topbar-right">
          <span id="user-email" class="user-email"></span>
          <button id="btn-add" class="btn-ghost btn-add" type="button">＋ 添加</button>
          <button id="btn-passwd" class="btn-ghost" type="button">修改密码</button>
          <button id="btn-theme" class="btn-ghost btn-theme" type="button" title="切换深色 / 浅色模式" aria-label="切换深色 / 浅色模式">🌙</button>
          <button id="btn-logout" class="btn-ghost">退出</button>
        </div>
      </div>
    </header>

    <div class="layout" id="layout">
      <aside class="sidebar" id="sidebar">
        <section class="side-section" id="sec-site-cats">
          <h2 class="side-head" tabindex="0" aria-expanded="true">网站分类<span class="side-count" id="cnt-site-cats"></span><span class="side-arrow">▾</span></h2>
          <div id="site-cats" class="side-list"></div>
        </section>
        <section class="side-section" id="sec-article-months">
          <h2 class="side-head" tabindex="0" aria-expanded="true">文章归档<span class="side-count" id="cnt-article-months"></span><span class="side-arrow">▾</span></h2>
          <div id="month-list" class="side-list"></div>
        </section>
        <section class="side-section hidden" id="sec-text-months">
          <h2 class="side-head" tabindex="0" aria-expanded="true">纯文本归档<span class="side-count" id="cnt-text-months"></span><span class="side-arrow">▾</span></h2>
          <div id="text-month-list" class="side-list"></div>
        </section>
        <section class="side-section hidden" id="sec-image-months">
          <h2 class="side-head" tabindex="0" aria-expanded="true">图片归档<span class="side-count" id="cnt-image-months"></span><span class="side-arrow">▾</span></h2>
          <div id="image-month-list" class="side-list"></div>
        </section>
        <section class="side-section" id="sec-notes">
          <h2 class="side-head" tabindex="0" aria-expanded="true">备注<span class="side-count" id="cnt-notes"></span><span class="side-arrow">▾</span></h2>
          <div id="note-list" class="side-list"></div>
        </section>
        <section class="side-section" id="sec-tags">
          <h2 class="side-head" tabindex="0" aria-expanded="true">标签<span class="side-count" id="cnt-tags"></span><span class="side-arrow">▾</span></h2>
          <div class="side-extra">
            <button id="btn-auto-tag" class="side-action" type="button" title="按域名和标题关键词识别未打标签的网站 / 文章">⌖ 一键识别</button>
          </div>
          <div id="tag-list" class="side-list"></div>
        </section>
      </aside>

      <main class="content">
        <div class="toolbar">
          <div class="chips" id="type-chips">
            <button class="chip active" data-type="site">网站</button>
            <button class="chip" data-type="article">文章</button>
            <button class="chip" data-type="text">纯文本</button>
            <button class="chip" data-type="image">图片</button>
          </div>
        </div>
        <div class="filters-row">
          <div class="search">
            <input id="search-input" type="search" placeholder="搜索标题、网址、备注或内容…" />
          </div>
          <select id="date-select" class="date-select" aria-label="按日期筛选">
            <option value="0">全部时间</option>
            <option value="1">近 24 小时</option>
            <option value="7">近 7 天</option>
            <option value="30">近 30 天</option>
            <option value="90">近 90 天</option>
          </select>
        </div>

        <div id="active-filters" class="active-filters"></div>

        <div id="list" class="list"></div>
        <div id="list-empty" class="empty hidden"></div>
        <div class="load-more-row">
          <button id="btn-more" class="btn-more hidden">加载更多</button>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="img-lightbox" class="img-lightbox hidden"><img alt="图片预览" /></div>

  <!-- 修改密码弹窗 -->
  <div id="pw-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 id="pw-modal-title" class="modal-title">修改密码</h3>
      <div class="form-row" id="pw-old-row">
        <label for="pw-old">当前密码</label>
        <input id="pw-old" type="password" autocomplete="current-password" />
      </div>
      <div class="form-row">
        <label for="pw-new">新密码（至少 8 位，含字母和数字）</label>
        <input id="pw-new" type="password" autocomplete="new-password" />
      </div>
      <div class="form-row">
        <label for="pw-new2">确认新密码</label>
        <input id="pw-new2" type="password" autocomplete="new-password" />
      </div>
      <div id="pw-msg" class="login-status" role="alert"></div>
      <div class="modal-actions">
        <button id="btn-pw-cancel" class="btn-ghost" type="button">取消</button>
        <button id="btn-pw-save" class="btn-primary btn-pw-save" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- 手动添加弹窗：网址 / 纯文本 / 图片 -->
  <div id="add-modal" class="modal-backdrop hidden">
    <div class="modal-card modal-card-add">
      <h3 class="modal-title">添加收藏</h3>
      <div class="add-tabs" id="add-tabs" role="tablist">
        <button type="button" class="active" data-add="link" role="tab">🌐 网站</button>
        <button type="button" data-add="article" role="tab">📄 文章</button>
        <button type="button" data-add="text" role="tab">📝 纯文本</button>
        <button type="button" data-add="image" role="tab">🖼 图片</button>
      </div>

      <div class="add-pane" id="add-pane-link">
        <div class="form-row">
          <label for="add-link-url">网址</label>
          <input id="add-link-url" type="text" placeholder="https://example.com/..." />
        </div>
        <div class="form-row">
          <label for="add-link-title">标题（可选，留空自动获取）</label>
          <input id="add-link-title" type="text" placeholder="不填则用域名作为标题" />
        </div>
        <div class="form-row">
          <label for="add-link-note">备注（可选）</label>
          <input id="add-link-note" type="text" placeholder="如：待读、设计参考" maxlength="100" />
        </div>
      </div>

      <div class="add-pane hidden" id="add-pane-article">
        <div class="form-row">
          <label for="add-art-url">网址</label>
          <input id="add-art-url" type="text" placeholder="https://example.com/post/..." />
        </div>
        <div class="form-row">
          <label for="add-art-title">标题（可选，留空自动获取）</label>
          <input id="add-art-title" type="text" placeholder="不填则自动抓取文章标题" />
        </div>
        <div class="form-row">
          <label for="add-art-note">备注（可选）</label>
          <input id="add-art-note" type="text" placeholder="如：待读、设计参考" maxlength="100" />
        </div>
        <p class="add-pane-hint">按「文章」归类，不按域名自动判定；保存时自动补一条所属网站的记录。</p>
      </div>

      <div class="add-pane hidden" id="add-pane-text">
        <div class="form-row">
          <label for="add-text">内容（上限 1 万字）</label>
          <textarea id="add-text" rows="6" placeholder="输入或粘贴要保存的文本…"></textarea>
        </div>
        <div class="form-row">
          <label for="add-text-src">来源（可选）</label>
          <input id="add-text-src" type="text" placeholder="https://…（留空则不记录）" />
        </div>
        <div class="form-row">
          <label for="add-text-note">备注（可选）</label>
          <input id="add-text-note" type="text" placeholder="如：待读、设计参考" maxlength="100" />
        </div>
      </div>

      <div class="add-pane hidden" id="add-pane-image">
        <div id="add-img-drop" class="img-drop" tabindex="0" role="button" aria-label="粘贴或选择图片">
          <p class="img-drop-hint">粘贴（Ctrl+V）、拖拽或</p>
          <p><button id="btn-img-pick" type="button" class="btn-link">选择图片</button></p>
          <input id="add-img-file" type="file" accept="image/*" class="hidden" />
          <p class="img-drop-note">≤5MB，保存后自动转存到服务端</p>
        </div>
        <div id="add-img-preview" class="img-preview hidden">
          <img id="add-img-thumb" alt="待保存的图片预览" />
          <div class="img-preview-meta">
            <span id="add-img-name" class="img-name"></span>
            <button id="btn-img-clear" type="button" class="btn-link">重新选择</button>
          </div>
        </div>
        <div class="form-row">
          <label for="add-img-note">备注（可选）</label>
          <input id="add-img-note" type="text" placeholder="如：待读、设计参考" maxlength="100" />
        </div>
      </div>

      <div id="add-msg" class="login-status" role="alert"></div>
      <div class="modal-actions">
        <button id="btn-add-cancel" class="btn-ghost" type="button">取消</button>
        <button id="btn-add-save" class="btn-primary btn-pw-save" type="button">保存</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
